name: Validate React demo
on:
  push:
  pull_request:

jobs:
  react-demo:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/react-demo
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: examples/react-demo/package-lock.json
      - run: npm ci
      - run: npm run check
